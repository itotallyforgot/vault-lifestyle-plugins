[project]
name = "vault-lifestyle-plugins-lib"
version = "0.1.0"
description = "Shared utilities for vault-lifestyle-plugins integrations: vault path resolver + raw/ frontmatter schema."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "vault-lifestyle-plugins contributors" }]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat-module layout: vault_resolver and frontmatter_schema are top-level
# importable modules. The verify line `from vault_resolver import ...`
# requires this shape, not a package wrapper.
py-modules = ["vault_resolver", "frontmatter_schema", "raw_writer"]

[tool.setuptools.package-data]
"*" = ["schemas/*.json"]

[tool.pytest.ini_options]
# Add lib/ root to sys.path so tests can `from vault_resolver import ...`
# without an editable install.
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
# Flat-module layout: name the importable modules explicitly rather than a
# directory, so the measured set is exactly this package's own code — never
# the sibling tests/ or anything under the uv-managed .venv/ that shares this
# root directory.
source = ["vault_resolver", "frontmatter_schema", "raw_writer"]

[tool.pyright]
# Point Pyright at the uv-managed venv so it sees pydantic / pytest / tomllib.
venvPath = "."
venv = ".venv"
extraPaths = ["."]
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []
