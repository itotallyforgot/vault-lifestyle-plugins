name: ci

# Thin caller for the central reusable Python CI.
# Each subdir (lib, youtube, spotify) is its own uv-managed project with its
# own pyproject.toml + uv.lock, so each gets its own caller job pinned to that
# working-directory. Job ids (ci-lib / ci-youtube / ci-spotify) keep the
# surfaced check names distinguishable.
#
# security-events: write is granted because the reusable's bandit job statically
# declares that permission. GitHub validates every nested job's requested
# permissions at startup, before evaluating `if:` gates, so the grant is
# required even though bandit is disabled (enable-bandit defaults to false).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-lib:
    permissions:
      contents: read
      security-events: write
    uses: itotallyforgot/.github/.github/workflows/ci-python-uv.yml@65d14a6d444c14ea729c23b3db8b5e9ecad86c79
    with:
      working-directory: lib
      # cov-floor gates the coverage the central reusable already measures.
      # Baseline observed on ubuntu CI: 95.56% (135 stmts, 6 missed). Floor set
      # just below so real regressions fail without the gate being flaky.
      # Scoped by [tool.coverage.run] source in lib/pyproject.toml.
      cov-floor: 95

  ci-youtube:
    permissions:
      contents: read
      security-events: write
    uses: itotallyforgot/.github/.github/workflows/ci-python-uv.yml@65d14a6d444c14ea729c23b3db8b5e9ecad86c79
    with:
      working-directory: youtube
      # Baseline observed on ubuntu CI: 91.29% (1390 stmts, 121 missed).
      # Scoped by [tool.coverage.run] source in youtube/pyproject.toml.
      cov-floor: 90

  ci-spotify:
    permissions:
      contents: read
      security-events: write
    uses: itotallyforgot/.github/.github/workflows/ci-python-uv.yml@65d14a6d444c14ea729c23b3db8b5e9ecad86c79
    with:
      working-directory: spotify
      # Baseline observed on ubuntu CI: 87.29% (118 stmts, 15 missed).
      # Scoped by [tool.coverage.run] source in spotify/pyproject.toml.
      cov-floor: 86
