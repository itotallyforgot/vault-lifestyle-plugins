name: ci

# Thin caller for the central reusable Python CI.
# Each subdir (lib, youtube, spotify) is its own uv-managed project with its
# own pyproject.toml + uv.lock, so each gets its own caller job pinned to that
# working-directory. Job ids (ci-lib / ci-youtube / ci-spotify) keep the
# surfaced check names distinguishable.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-lib:
    permissions:
      contents: read
    uses: itotallyforgot/.github/.github/workflows/ci-python-uv.yml@v1
    with:
      working-directory: lib

  ci-youtube:
    permissions:
      contents: read
    uses: itotallyforgot/.github/.github/workflows/ci-python-uv.yml@v1
    with:
      working-directory: youtube

  ci-spotify:
    permissions:
      contents: read
    uses: itotallyforgot/.github/.github/workflows/ci-python-uv.yml@v1
    with:
      working-directory: spotify
