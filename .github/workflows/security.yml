name: security

# Thin caller for the central reusable security baseline.
# Replaces the bespoke gitleaks + zizmor + dependency-review jobs.
# security-events: write is required so the reusable's zizmor job can upload
# its SARIF to code scanning.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    permissions:
      contents: read
      security-events: write
    uses: itotallyforgot/.github/.github/workflows/security-baseline.yml@v1
