name: security

# Thin caller for the central reusable security baseline.
# Replaces the bespoke gitleaks + zizmor + dependency-review jobs.
# security-events: write is required so the reusable's zizmor job can upload
# its SARIF to code scanning.
# No `secrets: inherit` needed: the built-in GITHUB_TOKEN is automatically
# available inside reusable workflows, and the reusable's gitleaks step reads
# it from its own secrets context. Inheriting all secrets would be needlessly
# broad.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    uses: itotallyforgot/.github/.github/workflows/security-baseline.yml@cceef198f9dfbdf32dc39e975be6e8a5ff27f315
