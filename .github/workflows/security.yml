name: security

# Thin caller for the central reusable security baseline.
# Replaces the bespoke gitleaks + zizmor + dependency-review jobs.
# security-events: write is required so the reusable's zizmor job can upload
# its SARIF to code scanning.
# secrets: inherit forwards GITHUB_TOKEN to the reusable; the gitleaks job
# references secrets.GITHUB_TOKEN, which resolves empty in a called workflow
# unless the caller inherits secrets, and gitleaks-action refuses to scan
# pull requests without a token.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    permissions:
      contents: read
      security-events: write
    uses: itotallyforgot/.github/.github/workflows/security-baseline.yml@v1
    secrets: inherit
