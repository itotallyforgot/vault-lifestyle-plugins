version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directories:
      - "/lib"
      - "/spotify"
      - "/youtube"
    schedule:
      interval: "daily"
    groups:
      python:
        patterns: ["*"]
